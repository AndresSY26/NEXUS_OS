<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Sombra exterior (Pixel Art Shadow) -->
  <rect x="3" y="5" width="27" height="24" fill="#05070a" opacity="0.4" />

  <!-- Carcasa del Monitor (Bezel Exterior) -->
  <rect x="2" y="4" width="27" height="23" fill="#2c3545" />
  
  <!-- Biseles de iluminación (3D Highlights - Top & Left) -->
  <rect x="2" y="4" width="27" height="1" fill="#475569" />
  <rect x="2" y="5" width="1" height="21" fill="#475569" />
  
  <!-- Biseles de sombra (3D Shadows - Bottom & Right) -->
  <rect x="2" y="26" width="27" height="1" fill="#181e29" />
  <rect x="28" y="4" width="1" height="23" fill="#181e29" />

  <!-- Pantalla del Terminal (Screen Container) -->
  <rect x="4" y="6" width="23" height="18" fill="#06090e" />
  
  <!-- Sutil brillo interno verde del fósforo CRT -->
  <rect x="5" y="7" width="21" height="16" fill="#00ff41" opacity="0.08" />

  <!-- Líneas de exploración de fósforo (Scanlines) -->
  <rect x="4" y="8" width="23" height="1" fill="#000000" opacity="0.25" />
  <rect x="4" y="10" width="23" height="1" fill="#000000" opacity="0.25" />
  <rect x="4" y="12" width="23" height="1" fill="#000000" opacity="0.25" />
  <rect x="4" y="14" width="23" height="1" fill="#000000" opacity="0.25" />
  <rect x="4" y="16" width="23" height="1" fill="#000000" opacity="0.25" />
  <rect x="4" y="18" width="23" height="1" fill="#000000" opacity="0.25" />
  <rect x="4" y="20" width="23" height="1" fill="#000000" opacity="0.25" />
  <rect x="4" y="22" width="23" height="1" fill="#000000" opacity="0.25" />

  <!-- Símbolo Prompt '>' (Pixel Art) -->
  <!-- Fila 1: px (6,9) -->
  <rect x="6" y="9" width="1" height="1" fill="#00ff41" />
  <!-- Fila 2: px (7,10) -->
  <rect x="7" y="10" width="1" height="1" fill="#00ff41" />
  <!-- Fila 3: px (8,11) -->
  <rect x="8" y="11" width="1" height="1" fill="#00ff41" />
  <!-- Fila 4: px (7,12) -->
  <rect x="7" y="12" width="1" height="1" fill="#00ff41" />
  <!-- Fila 5: px (6,13) -->
  <rect x="6" y="13" width="1" height="1" fill="#00ff41" />

  <!-- Cursor de Terminal '_' parpadeante (Pixel Art) -->
  <rect x="10" y="13" width="3" height="1" fill="#00ff41">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>

  <!-- Bits de código de máquina flotantes (Cero y Uno en Pixel Art) -->
  <!-- Número '1' a la derecha: px (16,9) a (16,13) -->
  <rect x="15" y="9" width="1" height="1" fill="#00ff41" opacity="0.6" />
  <rect x="16" y="8" width="1" height="6" fill="#00ff41" opacity="0.6" />
  <rect x="15" y="13" width="3" height="1" fill="#00ff41" opacity="0.6" />

  <!-- Número '0' abajo a la derecha: px (21,15) -->
  <rect x="21" y="15" width="3" height="5" fill="#00ff41" opacity="0.4" />
  <rect x="22" y="16" width="1" height="3" fill="#06090e" />

  <!-- Luces LED de diagnóstico del chasis inferior (Power, HDD) -->
  <rect x="24" y="25" width="1" height="1" fill="#00ff41" />
  <rect x="26" y="25" width="1" height="1" fill="#38bdf8" />
</svg>
